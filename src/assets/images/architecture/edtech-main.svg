<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050a1b" />
      <stop offset="50%" stop-color="#080e24" />
      <stop offset="100%" stop-color="#0c1738" />
    </linearGradient>
    <radialGradient id="glow-cyan" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#080e24" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-amber" cx="80%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#ff7b00" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#080e24" stop-opacity="0" />
    </radialGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#101d42" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0b1430" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="card-grad-active" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#162758" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0e1b3d" stop-opacity="0.95" />
    </linearGradient>

    <!-- Glowing filters -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="subtle-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1920" height="1080" fill="url(#bg)" />
  <rect width="1920" height="1080" fill="url(#glow-cyan)" />
  <rect width="1920" height="1080" fill="url(#glow-amber)" />

  <!-- Subtle Cyber Grid -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="180" x2="1920" y2="180" />
    <line x1="0" y1="360" x2="1920" y2="360" />
    <line x1="0" y1="540" x2="1920" y2="540" />
    <line x1="0" y1="720" x2="1920" y2="720" />
    <line x1="0" y1="900" x2="1920" y2="900" />
    <line x1="320" y1="0" x2="320" y2="1080" />
    <line x1="640" y1="0" x2="640" y2="1080" />
    <line x1="960" y1="0" x2="960" y2="1080" />
    <line x1="1280" y1="0" x2="1280" y2="1080" />
    <line x1="1600" y1="0" x2="1600" y2="1080" />
  </g>

  <!-- Header Section -->
  <g transform="translate(100, 90)">
    <rect x="-10" y="-10" width="8" height="64" rx="4" fill="#ff7b00" filter="url(#subtle-glow)" />
    <text x="18" y="24" fill="#ffffff" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-weight="900" font-size="34" letter-spacing="1.5">HIGH-CONCURRENCY ONLINE EXAMINATION ENGINE (THIPRO)</text>
    <text x="18" y="56" fill="#38bdf8" font-family="'Space Grotesk', 'Segoe UI', monospace" font-weight="600" font-size="16" letter-spacing="2">DISTRIBUTED TEST SESSION ARCHITECTURE SUPPORTING 100,000+ CONCURRENT CANDIDATES</text>
    <rect x="1560" y="8" width="160" height="36" rx="18" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1.5" />
    <text x="1640" y="32" fill="#e0f2fe" font-family="'Space Grotesk', monospace" font-weight="700" font-size="13" text-anchor="middle" letter-spacing="1">TECHNICAL SPEC</text>
  </g>

  <!-- Main Diagram Body -->
  
  <g stroke="#38bdf8" stroke-width="3" stroke-dasharray="8 6" opacity="0.7">
    <path d="M 400 480 L 460 480" />
    <path d="M 760 480 L 820 480" />
    <path d="M 1120 480 L 1180 480" />
    <path d="M 1480 480 L 1540 480" />
  </g>

  <!-- Node 1 -->
  <g transform="translate(100, 260)">
    <rect width="300" height="440" rx="20" fill="url(#card-grad)" stroke="#38bdf8" stroke-width="1.5" filter="url(#subtle-glow)" />
    <rect x="24" y="24" width="56" height="56" rx="14" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1.5" />
    <text x="52" y="60" fill="#38bdf8" font-size="28" text-anchor="middle">🌐</text>
    <text x="24" y="125" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="20">01. EDGE INGRESS</text>
    <text x="24" y="152" fill="#38bdf8" font-family="'Space Grotesk', monospace" font-weight="600" font-size="13">ĐIỀU PHỐI TẢI ĐỈNH</text>
    <line x1="24" y1="175" x2="276" y2="175" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1" />
    <text x="24" y="210" fill="#e2e8f0" font-family="'Plus Jakarta Sans', sans-serif" font-size="14.5" font-weight="600">• 100,000+ Thí sinh đồng thời</text>
    <text x="24" y="245" fill="#e2e8f0" font-family="'Plus Jakarta Sans', sans-serif" font-size="14.5" font-weight="600">• Cloudflare CDN &amp; WAF</text>
    <text x="24" y="280" fill="#e2e8f0" font-family="'Plus Jakarta Sans', sans-serif" font-size="14.5" font-weight="600">• Chống tấn công DDoS</text>
    <text x="24" y="315" fill="#e2e8f0" font-family="'Plus Jakarta Sans', sans-serif" font-size="14.5" font-weight="600">• Cân bằng tải NGINX Reverse</text>
    <rect x="24" y="360" width="252" height="44" rx="10" fill="rgba(56, 189, 248, 0.1)" stroke="rgba(56, 189, 248, 0.3)" />
    <text x="150" y="388" fill="#38bdf8" font-family="'Space Grotesk', monospace" font-size="12" font-weight="700" text-anchor="middle">CONCURRENCY: 100K+ USERS</text>
  </g>

  <!-- Node 2 -->
  <g transform="translate(460, 260)">
    <rect width="300" height="440" rx="20" fill="url(#card-grad)" stroke="#38bdf8" stroke-width="1.5" filter="url(#subtle-glow)" />
    <rect x="24" y="24" width="56" height="56" rx="14" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1.5" />
    <text x="52" y="60" fill="#38bdf8" font-size="28" text-anchor="middle">🛡️</text>
    <text x="24" y="125" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="20">02. EXAM SESSION</text>
    <text x="24" y="152" fill="#38bdf8" font-family="'Space Grotesk', monospace" font-weight="600" font-size="13">GIÁM SÁT THI &amp; BẢO MẬT</text>
    <line x1="24" y1="175" x2="276" y2="175" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1" />
    <text x="24" y="210" fill="#e2e8f0" font-family="'Plus Jakarta Sans', sans-serif" font-size="14.5" font-weight="600">• Node.js Clustered Workers</text>
    <text x="24" y="245" fill="#e2e8f0" font-family="'Plus Jakarta Sans', sans-serif" font-size="14.5" font-weight="600">• Phát hiện chuyển tab &amp; copy</text>
    <text x="24" y="280" fill="#e2e8f0" font-family="'Plus Jakarta Sans', sans-serif" font-size="14.5" font-weight="600">• Đếm ngược đồng bộ Server</text>
    <text x="24" y="315" fill="#e2e8f0" font-family="'Plus Jakarta Sans', sans-serif" font-size="14.5" font-weight="600">• Tự động nộp bài khi hết giờ</text>
    <rect x="24" y="360" width="252" height="44" rx="10" fill="rgba(56, 189, 248, 0.1)" stroke="rgba(56, 189, 248, 0.3)" />
    <text x="150" y="388" fill="#38bdf8" font-family="'Space Grotesk', monospace" font-size="12" font-weight="700" text-anchor="middle">ANTI-CHEAT TELEMETRY: ON</text>
  </g>

  <!-- Node 3 -->
  <g transform="translate(820, 240)">
    <rect width="300" height="480" rx="20" fill="url(#card-grad-active)" stroke="#ff7b00" stroke-width="2" filter="url(#neon-glow)" />
    <rect x="24" y="24" width="56" height="56" rx="14" fill="rgba(255, 123, 0, 0.2)" stroke="#ff7b00" stroke-width="1.5" />
    <text x="52" y="60" fill="#ff7b00" font-size="28" text-anchor="middle">⚡</text>
    <text x="24" y="125" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="20">03. REDIS CACHE</text>
    <text x="24" y="152" fill="#ff7b00" font-family="'Space Grotesk', monospace" font-weight="700" font-size="13">BỘ NHỚ MA TRẬN ĐỀ THI</text>
    <line x1="24" y1="175" x2="276" y2="175" stroke="rgba(255, 123, 0, 0.3)" stroke-width="1" />
    <text x="24" y="215" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700">• Trộn ngẫu nhiên câu hỏi/đáp án</text>
    <text x="24" y="250" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700">• Lưu vết câu trả lời từng giây</text>
    <text x="24" y="285" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700">• Chống mất bài khi rớt mạng</text>
    <text x="24" y="320" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700">• Redis Cluster Sub/Pub Event</text>
    <text x="24" y="355" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700">• Zero Database Lock Contention</text>
    <rect x="24" y="395" width="252" height="50" rx="12" fill="rgba(255, 123, 0, 0.15)" stroke="#ff7b00" stroke-width="1" />
    <text x="150" y="426" fill="#ff9838" font-family="'Space Grotesk', monospace" font-size="13" font-weight="800" text-anchor="middle">RESPONSE TIME: &lt; 5MS</text>
  </g>

  <!-- Node 4 -->
  <g transform="translate(1180, 260)">
    <rect width="300" height="440" rx="20" fill="url(#card-grad)" stroke="#38bdf8" stroke-width="1.5" filter="url(#subtle-glow)" />
    <rect x="24" y="24" width="56" height="56" rx="14" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1.5" />
    <text x="52" y="60" fill="#38bdf8" font-size="28" text-anchor="middle">🎯</text>
    <text x="24" y="125" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="20">04. AUTO SCORING</text>
    <text x="24" y="152" fill="#38bdf8" font-family="'Space Grotesk', monospace" font-weight="600" font-size="13">CHẤM ĐIỂM TỨC THÌ</text>
    <line x1="24" y1="175" x2="276" y2="175" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1" />
    <text x="24" y="210" fill="#e2e8f0" font-family="'Plus Jakarta Sans', sans-serif" font-size="14.5" font-weight="600">• Hàng đợi bất đồng bộ BullMQ</text>
    <text x="24" y="245" fill="#e2e8f0" font-family="'Plus Jakarta Sans', sans-serif" font-size="14.5" font-weight="600">• Chấm điểm tự động trong 0.2s</text>
    <text x="24" y="280" fill="#e2e8f0" font-family="'Plus Jakarta Sans', sans-serif" font-size="14.5" font-weight="600">• Đối chiếu giải thích chi tiết</text>
    <text x="24" y="315" fill="#e2e8f0" font-family="'Plus Jakarta Sans', sans-serif" font-size="14.5" font-weight="600">• Phân loại ma trận đúng/sai</text>
    <rect x="24" y="360" width="252" height="44" rx="10" fill="rgba(56, 189, 248, 0.1)" stroke="rgba(56, 189, 248, 0.3)" />
    <text x="150" y="388" fill="#38bdf8" font-family="'Space Grotesk', monospace" font-size="12" font-weight="700" text-anchor="middle">SCORING SPEED: 5,000/SEC</text>
  </g>

  <!-- Node 5 -->
  <g transform="translate(1540, 260)">
    <rect width="280" height="440" rx="20" fill="url(#card-grad)" stroke="#38bdf8" stroke-width="1.5" filter="url(#subtle-glow)" />
    <rect x="24" y="24" width="56" height="56" rx="14" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1.5" />
    <text x="52" y="60" fill="#38bdf8" font-size="28" text-anchor="middle">🏆</text>
    <text x="24" y="125" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="20">05. LEADERBOARD</text>
    <text x="24" y="152" fill="#38bdf8" font-family="'Space Grotesk', monospace" font-weight="600" font-size="13">BẢNG XẾP HẠNG &amp; AI</text>
    <line x1="24" y1="175" x2="256" y2="175" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1" />
    <text x="24" y="210" fill="#e2e8f0" font-family="'Plus Jakarta Sans', sans-serif" font-size="14.5" font-weight="600">• Báo cáo phân tích điểm số</text>
    <text x="24" y="245" fill="#e2e8f0" font-family="'Plus Jakarta Sans', sans-serif" font-size="14.5" font-weight="600">• Gợi ý kiến thức ôn tập lại</text>
    <text x="24" y="280" fill="#e2e8f0" font-family="'Plus Jakarta Sans', sans-serif" font-size="14.5" font-weight="600">• Xếp hạng năng lực thời gian thực</text>
    <text x="24" y="315" fill="#e2e8f0" font-family="'Plus Jakarta Sans', sans-serif" font-size="14.5" font-weight="600">• Lưu trữ bài thi PostgreSQL</text>
    <rect x="24" y="360" width="232" height="44" rx="10" fill="rgba(56, 189, 248, 0.1)" stroke="rgba(56, 189, 248, 0.3)" />
    <text x="140" y="388" fill="#38bdf8" font-family="'Space Grotesk', monospace" font-size="12" font-weight="700" text-anchor="middle">RANKING SYNC: REAL-TIME</text>
  </g>


  <!-- Footer Branding -->
  <g transform="translate(100, 1020)">
    <text x="0" y="0" fill="#64748b" font-family="'Space Grotesk', monospace" font-size="14" letter-spacing="1">ARCHITECTURAL DESIGN &amp; ENGINEERING // ĐỖ VĂN XUÂN (XUANCO941)</text>
    <text x="1720" y="0" fill="#38bdf8" font-family="'Space Grotesk', monospace" font-weight="700" font-size="14" text-anchor="end" letter-spacing="1.5">BLUE HOUR EDITION</text>
  </g>
</svg>